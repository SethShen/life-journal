<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}} · 成长足迹</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>

<article class="album-page">

  <!-- 页眉 -->
  <header class="al-page-head">
    <div class="al-page-head-l">
      <a class="back" href="../index.html?view=growth">← 成长足迹</a>
      <span class="al-kicker">GROWING FOOTPRINTS</span>
      <h1 class="al-page-title">{{title}}</h1>
      <div class="al-page-meta">
        <span class="photo-count">{{photo_count}} 张照片</span>
      </div>
    </div>
    <div class="al-page-head-r">
      <span class="al-yy">{{year}}</span>
      <span class="al-mm">{{month_num}} 月</span>
    </div>
  </header>

  <!-- 正文（序 / 编号站点 / 小结） -->
  <div class="al-body">
    {{content}}
  </div>

  <!-- 页脚 -->
  <footer class="al-page-foot">
    <span class="al-foot-l">{{year}} / {{month_num}}</span>
    <span class="al-foot-r">{{month_cn}}月结束</span>
  </footer>

  <div class="al-standalone">
    <a class="back" href="../index.html?view=growth">← 返回成长足迹</a>
  </div>

</article>

<!-- 灯箱 -->
<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" type="button" aria-label="关闭">×</button>
  <button class="lb-prev" type="button" aria-label="上一张">‹</button>
  <img class="lb-img" id="lb-img" src="" alt="">
  <button class="lb-next" type="button" aria-label="下一张">›</button>
  <div class="lb-counter" id="lb-counter"></div>
</div>

<script>
(function () {
  var imgs = Array.prototype.slice.call(
    document.querySelectorAll('.al-body figure.photo img, .al-body > img, .gallery-item img')
  );
  if (!imgs.length) return;

  var srcs = imgs.map(function (im) {
    var el = im.closest('.gallery-item');
    return el ? el.getAttribute('href') : im.src;
  });

  var lb = document.getElementById('lightbox');
  var lbImg = document.getElementById('lb-img');
  var lbCounter = document.getElementById('lb-counter');
  var cur = 0;

  function show(i) {
    cur = (i + srcs.length) % srcs.length;
    lbImg.src = srcs[cur];
    lbCounter.textContent = (cur + 1) + ' / ' + srcs.length;
    lb.hidden = false;
    document.body.style.overflow = 'hidden';
  }

  function hide() {
    lb.hidden = true;
    lbImg.src = '';
    document.body.style.overflow = '';
  }

  imgs.forEach(function (im, i) {
    im.style.cursor = 'zoom-in';
    im.addEventListener('click', function (e) {
      e.preventDefault();
      show(i);
    });
  });

  lb.querySelector('.lb-close').addEventListener('click', hide);
  lb.querySelector('.lb-prev').addEventListener('click', function (e) { e.stopPropagation(); show(cur - 1); });
  lb.querySelector('.lb-next').addEventListener('click', function (e) { e.stopPropagation(); show(cur + 1); });
  lb.addEventListener('click', function (e) { if (e.target === lb) hide(); });

  document.addEventListener('keydown', function (e) {
    if (lb.hidden) return;
    if (e.key === 'Escape') hide();
    if (e.key === 'ArrowLeft') show(cur - 1);
    if (e.key === 'ArrowRight') show(cur + 1);
  });
})();
</script>

</body>
</html>
