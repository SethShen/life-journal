<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{site_title}}</title>
<meta name="description" content="记录每一次出发">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <h1 class="site-title">{{site_title}}</h1>
    <p class="site-sub">共 <span id="total-count">{{count}}</span> 段旅程<span id="growth-summary">{{growth_count_text}}</span> · 更新于 {{updated}}</p>
  </div>
</header>

<main class="wrap">

  <!-- 页签 -->
  <nav class="tabs" id="tabs" role="tablist">
    <a class="tab is-active" href="?view=trips" data-view="trips" role="tab">旅程</a>
    <a class="tab" href="?view=growth" data-view="growth" role="tab">成长足迹</a>
  </nav>

  <!-- ========== 旅程 ========== -->
  <div class="view" id="view-trips">

  <!-- 筛选栏 -->
  <section class="filters" id="filters">
    <div class="filter-row">
      <input type="search" id="search" class="search-input" placeholder="搜索标题、地点、内容…" autocomplete="off">
      <button class="clear-btn" type="button" id="clear-all" hidden>清除筛选</button>
    </div>

    <div class="filter-row filter-row--chips">
      <span class="filter-label">时间</span>
      <div class="chips" id="year-chips">
        <button class="chip chip--all is-active" type="button" data-filter-year="">全部</button>
        {{year_filters}}
      </div>
    </div>

    <div class="filter-row filter-row--chips">
      <span class="filter-label">标签</span>
      <div class="chips" id="tag-chips">
        <button class="chip chip--all is-active" type="button" data-filter-tag="">全部</button>
        {{tag_filters}}
      </div>
    </div>
  </section>

  <!-- 结果计数 -->
  <p class="result-count" id="result-count" hidden></p>

  <!-- 卡片 -->
  <div class="grid" id="grid">
    {{cards}}
  </div>

  <!-- 空状态 -->
  <div class="empty-state" id="empty-state" hidden>
    <div class="empty-icon">✦</div>
    <p>没有符合条件的记录</p>
    <button class="clear-btn" type="button" id="clear-empty">清除筛选</button>
  </div>

  </div><!-- /view-trips -->

  <!-- ========== 成长足迹 ========== -->
  <div class="view" id="view-growth" hidden>

    <section class="growth-intro">
      <p>按时间顺序，记录她长大的每一个刻度。</p>
    </section>

    <div class="timeline" id="timeline">
      {{timeline}}
    </div>

    <div class="empty-state" id="growth-empty" hidden>
      <div class="empty-icon">✦</div>
      <p>还没有成长记录</p>
    </div>

  </div><!-- /view-growth -->

</main>

<footer class="site-footer">
  <div class="wrap">
    <p>用 Git 记录生活 · Powered by Cloudflare Pages</p>
  </div>
</footer>

<script>
(function () {
  // ---- 页签切换：旅程 / 成长足迹 ----
  var TABS = {
    trips: {
      tab: document.querySelector('[data-view="trips"]'),
      view: document.getElementById('view-trips'),
      summary: null
    },
    growth: {
      tab: document.querySelector('[data-view="growth"]'),
      view: document.getElementById('view-growth')
    }
  };
  var growthSummary = document.getElementById('growth-summary');
  var growthEmpty = document.getElementById('growth-empty');
  var timeline = document.getElementById('timeline');
  var current = 'trips';

  function setView(name, pushUrl) {
    if (!TABS[name]) name = 'trips';
    current = name;

    Object.keys(TABS).forEach(function (k) {
      TABS[k].view.hidden = k !== name;
      TABS[k].tab.classList.toggle('is-active', k === name);
      TABS[k].tab.setAttribute('aria-selected', k === name ? 'true' : 'false');
    });

    // 副标题里的成长条数只在成长视图显示
    if (growthSummary) growthSummary.hidden = name !== 'growth';

    // 成长为空时提示
    if (growthEmpty && timeline) {
      growthEmpty.hidden = !!timeline.querySelector('.tl-item');
    }

    if (pushUrl) {
      var p = new URLSearchParams(location.search);
      if (name === 'growth') p.set('view', 'growth');
      else p.delete('view');
      // 切到成长视图时清掉旅行的筛选参数，反之亦然
      p.delete('tag'); p.delete('year'); p.delete('q');
      var qs = p.toString();
      history.pushState(null, '', qs ? '?' + qs : location.pathname);
    }

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  Object.keys(TABS).forEach(function (k) {
    TABS[k].tab.addEventListener('click', function (ev) {
      ev.preventDefault();
      if (k === current) return;
      setView(k, true);
    });
  });

  // 从 URL 读取初始视图
  if (new URLSearchParams(location.search).get('view') === 'growth') {
    setView('growth', false);
  } else {
    setView('trips', false);
  }

  window.addEventListener('popstate', function () {
    var v = new URLSearchParams(location.search).get('view');
    setView(v === 'growth' ? 'growth' : 'trips', false);
  });

  // ---- 旅程筛选 ----
  var grid = document.getElementById('grid');
  var cards = Array.prototype.slice.call(grid.querySelectorAll('.card'));
  var searchInput = document.getElementById('search');
  var resultCount = document.getElementById('result-count');
  var emptyState = document.getElementById('empty-state');
  var clearAll = document.getElementById('clear-all');
  var clearEmpty = document.getElementById('clear-empty');

  var state = { tag: '', year: '', q: '' };

  // 从 URL 读取初始筛选
  var params = new URLSearchParams(location.search);
  if (params.get('tag')) state.tag = params.get('tag');
  if (params.get('year')) state.year = params.get('year');
  if (params.get('q')) state.q = params.get('q');

  // 预读卡片的筛选属性
  cards.forEach(function (card) {
    try {
      card._tags = JSON.parse(card.dataset.tags || '[]');
    } catch (e) {
      card._tags = [];
    }
    card._tagStr = card._tags.join('\u0000');
    card._year = card.dataset.year || '';
    card._search = card.dataset.search || '';
  });

  function apply() {
    var q = state.q.trim().toLowerCase();
    var visible = 0;

    cards.forEach(function (card) {
      var ok = true;
      if (state.tag && card._tagStr.indexOf(state.tag) === -1) ok = false;
      if (ok && state.year && card._year !== state.year) ok = false;
      if (ok && q && card._search.indexOf(q) === -1) ok = false;

      card.hidden = !ok;
      if (ok) visible++;
    });

    // 计数
    var filtering = state.tag || state.year || q;
    resultCount.hidden = !filtering;
    if (filtering) {
      resultCount.textContent = '找到 ' + visible + ' 条记录';
    }

    emptyState.hidden = visible !== 0;
    clearAll.hidden = !filtering;

    // chip 高亮
    document.querySelectorAll('[data-filter-tag]').forEach(function (el) {
      el.classList.toggle('is-active', el.dataset.filterTag === state.tag);
    });
    document.querySelectorAll('[data-filter-year]').forEach(function (el) {
      el.classList.toggle('is-active', el.dataset.filterYear === state.year);
    });

    // 同步 URL（不产生历史记录堆积）
    var p = new URLSearchParams();
    if (current === 'growth') p.set('view', 'growth');
    if (state.tag) p.set('tag', state.tag);
    if (state.year) p.set('year', state.year);
    if (q) p.set('q', state.q);
    var qs = p.toString();
    history.replaceState(null, '', qs ? '?' + qs : location.pathname);
  }

  // 点击标签 chip
  document.querySelectorAll('[data-filter-tag]').forEach(function (el) {
    el.addEventListener('click', function () {
      state.tag = el.dataset.filterTag;
      apply();
    });
  });

  // 点击年份 chip
  document.querySelectorAll('[data-filter-year]').forEach(function (el) {
    el.addEventListener('click', function () {
      state.year = el.dataset.filterYear;
      apply();
    });
  });

  // 卡片上的标签：点击筛选而不是跳转
  grid.querySelectorAll('button.tag').forEach(function (el) {
    el.addEventListener('click', function (ev) {
      ev.preventDefault();
      ev.stopPropagation();
      state.tag = el.dataset.tag;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      apply();
    });
  });

  // 搜索（防抖）
  var timer;
  searchInput.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      state.q = searchInput.value;
      apply();
    }, 180);
  });

  function reset() {
    state = { tag: '', year: '', q: '' };
    searchInput.value = '';
    apply();
  }
  clearAll.addEventListener('click', reset);
  clearEmpty.addEventListener('click', reset);

  // 初始化：回填 URL 中的搜索词
  if (state.q) searchInput.value = state.q;
  apply();
})();
</script>

</body>
</html>
